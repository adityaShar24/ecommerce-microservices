version: '3.9'
services:
  order_service:
    build: .
    container_name: order_service
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=5432
      - DB_PORT=5432
      - DB_NAME=orders_db
    depends_on:
      - db
  
  db:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: orders_db
    ports:
      - "5432: 5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

    

  volumes:
    postgres_data: